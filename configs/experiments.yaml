# RAG uncertainty experiments config
# Runs 4 generation models × 2 prompt variants × 2 context modes = 16 experiments

input_csv: data/rag_eval_en_300.csv
output_dir: outputs/generation

n_rows: null
save_every: 1
sleep_between_calls: 0.1
max_retries: 3

columns:
  query: [query]
  distractor: [distractor_text]
  gold_passage: [gold_generation_text]
  gold_judge_passage: [gold_judge_text]

prompt_variants:
  simple:
    system_prompt: |-
      You are a question-answering system for RAG evaluation.
      Use only the provided context passage.
      Do not use outside knowledge.
      Keep the answer concise.
  advanced:
    system_prompt: |-
      You are a question-answering system for RAG evaluation.
      Use only the provided context passage.
      Do not use outside knowledge.
      If the context does not contain enough information to answer the question, say: "I don't know based on the provided context."
      Keep the answer concise.

context_modes:
  distractor:
    answer_col: answer_with_distractor
    include_distractor: true
    include_gold: false
  distractor_plus_gold:
    answer_col: answer_with_distractor_and_gold
    include_distractor: true
    include_gold: true

models:
  gpt54mini:
    provider: azure
    model: gpt-5.4-mini
    temperature: 0
    max_output_tokens: 256
    reasoning_effort: none
    think: false
  gemini31_flash_lite:
    provider: gemini
    model: gemini-3.1-flash-lite
    temperature: 0
    max_output_tokens: 256
    thinking_budget: 0
    include_thoughts: false
    think: false
    api_key_env: GEMINI_API_KEY
  claude_sonnet_4:
    provider: anthropic
    model: claude-sonnet-4-5-20250929
    temperature: 0
    max_output_tokens: 512
    thinking: false
    think: false
  

# Leave empty/null to run all combinations.
# Or restrict, e.g. only: [gpt5__simple__distractor]
only: null
