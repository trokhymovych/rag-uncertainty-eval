# English-only experiment using local Ollama inference (gemma4:26b)
# Runs 1 generation model × 2 prompt variants × 2 context modes = 4 experiments
#
# Prerequisites:
#   ollama serve
#   ollama pull gemma4:26b
#
# Generation:
#   python src/rag_eval/run_generation.py --config configs/experiments_en_ollama.yaml
#
# Judge (Ollama):
#   python src/rag_eval/run_judge.py \
#     --config configs/experiments_en_ollama.yaml \
#     --input outputs/generation_en_ollama/<experiment>.csv \
#     --judge-provider ollama \
#     --model gemma4:26b
#
# Judge (OpenAI fallback):
#   python src/rag_eval/run_judge.py \
#     --config configs/experiments_en_ollama.yaml \
#     --input outputs/generation_en_ollama/<experiment>.csv \
#     --judge-provider openai \
#     --model gpt-4.1

input_csv: data/rag_eval_multilingual_eval.csv
output_dir: outputs/generation_en_ollama
language_filter: en

n_rows: null
save_every: 10
sleep_between_calls: 0.0
max_retries: 3

columns:
  query: [query]
  distractor: [distractor_text]
  gold_passage: [gold_generation_text]
  gold_judge_passage: [gold_judge_text]


prompt_variants:
  simple:
    system_prompt: |-
      You are a question-answering system for RAG evaluation.
      Use only the provided context passage.
      Do not use outside knowledge.
      Keep the answer concise.
  advanced:
    system_prompt: |-
      You are a question-answering system for RAG evaluation.
      Use only the provided context passage.
      Do not use outside knowledge.
      If the context does not contain enough information to answer the question, say: "I don't know based on the provided context."
      Keep the answer concise.

context_modes:
  distractor:
    answer_col: answer_with_distractor
    include_distractor: true
    include_gold: false
  distractor_plus_gold:
    answer_col: answer_with_distractor_and_gold
    include_distractor: true
    include_gold: true

models:
  gemma4_26b:
    provider: ollama
    base_url: http://localhost:11434
    model: gemma4:26b
    temperature: 0
    max_output_tokens: 256
    think: false

only: null
